name: Daily Supabase backup

# Dumps the public schema from Supabase (data + DDL) once a day and stores
# the result as a GitHub Actions artifact. Free Supabase tier has no built-in
# automated backups, so we self-host this. Repo MUST be private — the dump
# contains PII (emails, free-text survey answers).
#
# Each run produces:
#   1. backup-*.dump — full pg_dump (custom format) for pg_restore;
#      includes ALL public-schema objects: tables, views, indexes,
#      RLS policies, functions.
#   2. <table>-*.csv — one flat CSV per base table in public, for
#      human reading. Tables are auto-discovered via pg_tables, so
#      adding a new table to public makes it back up automatically.
#
# Security note: this workflow uses no untrusted user input. All inputs are
# either GitHub-controlled (run_id) or come from secrets/env. No issue/PR/
# commit fields touch the run: blocks, so command-injection vectors are nil.

on:
  # DISABLED: research phase is closed. The daily backup is switched off so
  # this workflow no longer runs automatically. Re-enable by uncommenting the
  # `schedule` block below. Manual runs stay available via workflow_dispatch.
  # schedule:
  #   # Every day at 09:17 UTC (offset minute keeps us out of the :00 rush).
  #   - cron: "17 9 * * *"
  workflow_dispatch:

# Opt into Node.js 24 for upload-artifact and other JS-based actions.
# GitHub deprecated Node.js 20 (Sept 2025); Node 24 becomes default June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Postgres client 17 (matches Supabase server)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # ubuntu-latest ships postgresql-client-16 pre-installed; the
          # /usr/bin/pg_dump wrapper picks the oldest installed major by
          # default. Prepend the v17 bin dir so subsequent steps resolve
          # both `pg_dump` and `psql` to v17 binaries.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/psql --version

      - name: Compute timestamp
        id: stamp
        run: echo "value=$(date -u +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Run pg_dump (full backup)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAMP: ${{ steps.stamp.outputs.value }}
        run: |
          set -euo pipefail
          OUT="backup-${STAMP}.dump"

          pg_dump \
            --no-owner \
            --no-privileges \
            --schema=public \
            --format=custom \
            "$DATABASE_URL" > "$OUT"

          ls -lh "$OUT"
          MIN_BYTES=512
          ACTUAL=$(stat -c%s "$OUT")
          if [ "$ACTUAL" -lt "$MIN_BYTES" ]; then
            echo "Dump is only $ACTUAL bytes — bailing out." >&2
            exit 1
          fi

      - name: Export every public table to CSV
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAMP: ${{ steps.stamp.outputs.value }}
        run: |
          set -euo pipefail

          # Discover every base table in the `public` schema.
          # pg_tables omits views, materialized views, and Supabase-internal
          # schemas (auth, storage, realtime, etc. — those live elsewhere).
          TABLES=$(psql "$DATABASE_URL" \
            --no-psqlrc --quiet --tuples-only --no-align \
            --command "select tablename from pg_tables where schemaname = 'public' order by tablename")

          if [ -z "$TABLES" ]; then
            echo "No tables found in public schema — bailing out." >&2
            exit 1
          fi

          echo "Tables to export:"
          echo "$TABLES" | sed 's/^/  - /'
          echo "---"

          while IFS= read -r TABLE; do
            [ -z "$TABLE" ] && continue
            OUT="${TABLE}-${STAMP}.csv"
            echo "Exporting public.${TABLE} → ${OUT}"

            # Identifiers are double-quoted to handle table names with
            # mixed case or special chars; safe because TABLE comes from
            # pg_tables (Postgres-controlled), not user input.
            psql "$DATABASE_URL" \
              --no-psqlrc --quiet \
              --command "\copy (select * from \"public\".\"${TABLE}\") to stdout with csv header" \
              > "$OUT"

            ls -lh "$OUT"
            # Header row is always present even on empty tables, so an
            # empty file means the connection or pipe broke mid-stream.
            if [ ! -s "$OUT" ]; then
              echo "CSV is empty for ${TABLE} — bailing out." >&2
              exit 1
            fi
          done <<< "$TABLES"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: |
            backup-*.dump
            *.csv
          retention-days: 90
          if-no-files-found: error
